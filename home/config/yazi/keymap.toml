[input]
keymap = [
  { on = [ "<Esc>" ], exec = "escape", desc = "Exit input mode" },
  { on = [ "<C-c>" ], exec = "close", desc = "Close" },
  { on = [ "<Enter>" ], exec = "close --submit", desc = "Submit the input" },
  { on = [ "<C-u>" ], exec = "move 0", desc = "Move to the beginning" },
  { on = [ "<C-k>" ], exec = "move -999", desc = "Move to the beginning" },
  { on = [ "<C-w>" ], exec = "delete 0", desc = "Delete to the beginning" },
]

[manager]
keymap = [
  # Navigation
  { on = [ "k" ], exec = "arrow -1", desc = "Move up" },
  { on = [ "j" ], exec = "arrow 1", desc = "Move down" },
  { on = [ "h" ], exec = "leave", desc = "Go back to parent" },
  { on = [ "l" ], exec = "enter", desc = "Enter directory" },

  # Selection
  { on = [ "v" ], exec = "toggle", desc = "Toggle selection" },
  { on = [ "V" ], exec = "toggle --all", desc = "Toggle all selection" },

  # File operations
  { on = [ "c" ], exec = "copy", desc = "Copy selected" },
  { on = [ "x" ], exec = "cut", desc = "Cut selected" },
  { on = [ "p" ], exec = "paste", desc = "Paste" },
  { on = [ "d" ], exec = "remove", desc = "Delete" },
  { on = [ "a" ], exec = "create", desc = "Create" },
  { on = [ "r" ], exec = "rename", desc = "Rename" },

  # View
  { on = [ "." ], exec = "toggle --hidden", desc = "Toggle hidden files" },
  { on = [ "z" ], exec = "sort", desc = "Sort" },

  # Search
  { on = [ "/" ], exec = "find", desc = "Find" },
  { on = [ "?" ], exec = "find --previous", desc = "Find previous" },

  # Exit
  { on = [ "q" ], exec = "quit", desc = "Quit yazi" },
]
